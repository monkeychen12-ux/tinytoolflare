name: Bug report
description: Report a broken tool, incorrect result, or page issue.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue with TinyToolFlare.
  - type: input
    id: tool-url
    attributes:
      label: Tool URL
      description: Paste the TinyToolFlare page where the issue happened.
      placeholder: https://www.tinytoolflare.com/image/compressor
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the issue and what you expected instead.
      placeholder: The tool showed...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps, inputs, or files needed to reproduce the issue.
      placeholder: |
        1. Open the tool
        2. Upload or enter...
        3. Click...
    validations:
      required: false
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome on macOS, Safari on iPhone, etc.
    validations:
      required: false
